---
- name: assert | Validate wud_docker_network_name
  ansible.builtin.assert:
    that:
      - wud_docker_network_name is defined
      - wud_docker_network_name is string
      - wud_docker_network_name | length > 0
    fail_msg: "wud_docker_network_name must be a non-empty string"

