---
- name: wud | Set application facts
  ansible.builtin.set_fact:
    app_name: "wud"
    app_image: "{{ wud_docker_version }}"
    app_network: "{{ wud_docker_network_name }}"
    app_base_path: "{{ wud_docker_base_path }}"
    app_user: "{{ wud_docker_user }}"
    app_uid: "{{ wud_docker_uid }}"
    app_group: "{{ wud_docker_group }}"
    app_gid: "{{ wud_docker_gid }}"
    app_timezone: "{{ wud_docker_timezone }}"
    app_environment_variables: "{{ wud_docker_environment_variables }}"
    app_labels: "{{ wud_docker_labels }}"
    app_ports: "{{ wud_docker_ports }}"

- name: wud | Ensure app folder exists
  ansible.builtin.file:
    name: "{{ app_base_path }}/{{ app_name }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0770"
    state: directory

- name: wud | Get docker executable path
  ansible.builtin.command:
    cmd: "which docker"
  changed_when: false
  register: wud_docker_executable_path

- name: wud | Create docker-compose.yml
  ansible.builtin.template:
    src: "docker-compose.yml.j2"
    dest: "{{ app_base_path }}/{{ app_name }}/docker-compose.yml"
    mode: "0640"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
  notify: Wud restart

- name: wud | Create systemd service
  ansible.builtin.template:
    src: "systemd.service.j2"
    dest: "/etc/systemd/system/{{ app_name }}.service"
    mode: "0770"
    owner: "root"
    group: "root"
  notify:
    - Wud systemd reload
    - Wud restart
